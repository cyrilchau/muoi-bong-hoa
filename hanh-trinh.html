<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hành Trình Hái Hoa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=VT323&display=swap">
<style>
:root{
  /* One committed look: night garden around a pixel canvas, paper cards with hard ink shadows */
  --ink:#2a1630;
  --night:#170f2b;
  --dusk:#2a1c48;
  --paper:#fff7ef;
  --blush:#ffd3df;
  --rose:#e2456f;
  --rose-hi:#ee6088;
  --rose-deep:#b82d55;
  --gold:#ffd36b;
  --muted:#7a5a72;
  --f-pixel:'VT323', ui-monospace, 'Courier New', monospace;
  --f-script:'Dancing Script', 'Segoe Script', 'Apple Chancery', cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-pixel);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(env(safe-area-inset-bottom,0px) + var(--ctrl-h,0px));
  background:radial-gradient(ellipse at 50% 40%,var(--dusk) 0%,var(--night) 70%)}
#stage{position:relative;width:320px;height:180px;--u:1px;box-shadow:0 0 0 2px var(--ink),0 18px 50px rgba(0,0,0,.45)}
#game{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}

.banner{position:absolute;left:50%;top:9%;transform:translate(-50%,-8px);opacity:0;transition:opacity .5s ease,transform .5s ease;
  pointer-events:none;text-align:center;white-space:nowrap;background:var(--paper);color:var(--ink);
  border:max(2px,calc(var(--u)*1)) solid var(--ink);box-shadow:max(3px,calc(var(--u)*2)) max(3px,calc(var(--u)*2)) 0 var(--ink);
  padding:max(2px,calc(var(--u)*1.5)) max(10px,calc(var(--u)*8))}
.banner.show{opacity:1;transform:translate(-50%,0)}
.banner b{display:block;font-weight:400;font-size:max(18px,calc(var(--u)*13));line-height:1;color:var(--rose-deep)}
.banner small{display:block;font-size:max(13px,calc(var(--u)*7));line-height:1.1;letter-spacing:.06em;text-transform:uppercase}
.hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;
  font-size:max(15px,calc(var(--u)*8));color:var(--paper);text-shadow:2px 2px 0 var(--ink);padding:0 8px;background:rgba(42,22,48,.45)}
.hint.show{opacity:1}
.mute{position:absolute;top:max(4px,calc(var(--u)*3));right:max(4px,calc(var(--u)*3));
  width:max(30px,calc(var(--u)*13));height:max(30px,calc(var(--u)*13));display:grid;place-items:center;padding:0;cursor:pointer;
  background:rgba(255,247,239,.85);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
  font-size:max(18px,calc(var(--u)*9));line-height:1}
.mute[aria-pressed="true"]{background:rgba(255,247,239,.45);text-decoration:line-through}

#controls{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(14px + env(safe-area-inset-bottom,0px))}
#controls .grp{display:flex;gap:12px;pointer-events:auto}
.pad{width:64px;height:64px;display:grid;place-items:center;padding:0;cursor:pointer;touch-action:none;
  background:rgba(255,247,239,.2);color:var(--paper);border:3px solid rgba(255,247,239,.75);box-shadow:0 4px 0 rgba(42,22,48,.7)}
.pad.on{background:rgba(255,211,223,.55);transform:translateY(3px);box-shadow:0 1px 0 rgba(42,22,48,.7)}
.pad svg{width:30px;height:30px;shape-rendering:crispEdges;fill:currentColor}
.pad.jump{width:76px;height:76px}
@media (orientation:portrait){
  .pad{width:78px;height:78px;background:rgba(255,247,239,.12)}
  .pad.jump{width:92px;height:92px}
  #controls{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
}

.screen{position:fixed;inset:0;z-index:10;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  background:rgba(23,15,43,.5)}
.panel{width:min(440px,100%);display:grid;justify-items:center;gap:10px;text-align:center;padding:22px 22px 18px;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px var(--blush),6px 6px 0 var(--ink)}
.title-art{height:clamp(84px,24vh,150px);width:auto;max-width:100%;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
.panel h1{margin:0;font-weight:400;font-size:clamp(40px,9vw,60px);line-height:.85;color:var(--rose);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.panel .sub{margin:0;font-size:clamp(20px,4.5vw,26px);line-height:1;color:var(--rose-deep);letter-spacing:.04em}
.panel .goal{margin:0;font-size:clamp(18px,4vw,22px);line-height:1.1;max-width:30ch;text-wrap:balance}
.panel .keys{margin:0;font-size:18px;line-height:1.1;color:var(--muted)}
.btn{background:var(--rose);color:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:6px 26px 4px;
  font-size:30px;line-height:1;cursor:pointer;text-shadow:2px 2px 0 var(--rose-deep)}
.btn:hover{background:var(--rose-hi)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.small{font-size:24px;padding:4px 18px 2px;margin-top:4px}
@media (max-height:460px){
  .panel{gap:6px;padding:12px 18px}
  .title-art{height:70px}
  .panel h1{font-size:40px}
}

.end{background:rgba(23,15,43,0);transition:background .8s}
.end.show{background:rgba(23,15,43,.55)}
.envelope{display:grid;justify-items:center;gap:14px;background:none;border:0;padding:8px;cursor:pointer;
  opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
.end.show .envelope{opacity:1;transform:none}
.envelope canvas{width:min(260px,58vw);height:auto;image-rendering:pixelated;animation:bob 1.8s ease-in-out infinite}
.envelope.opening canvas{animation:none}
.envelope.opening .tap{visibility:hidden}
.tap{font-size:28px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);animation:blink 1.1s steps(2,start) infinite}

.card{position:relative;width:min(540px,100%);max-height:100%;overflow:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text;
  display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 30px 22px;
  background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px var(--blush),8px 8px 0 var(--ink);
  opacity:0;transform:translateY(24px) scale(.9);transition:opacity .7s ease,transform .7s cubic-bezier(.2,1.3,.4,1)}
.card.show{opacity:1;transform:none}
.card-head{margin:0;font-weight:400;font-size:clamp(20px,4.6vw,28px);line-height:1;color:var(--rose-deep);letter-spacing:.03em;text-wrap:balance;padding-inline:26px}
.bq{height:clamp(100px,24vh,200px);width:auto;max-width:100%;image-rendering:pixelated}
.letter{margin:0;font-family:var(--f-script);font-weight:700;font-size:clamp(25px,5.6vw,36px);line-height:1.4;color:var(--ink);max-width:24ch;text-wrap:balance}
.letter .rest{visibility:hidden}
.letter.typing #typed::after{content:"";display:inline-block;width:.08em;height:.9em;margin-left:2px;vertical-align:-.1em;background:var(--rose);animation:blink .8s steps(2,start) infinite}
.sign{margin:0;justify-self:end;font-family:var(--f-script);font-weight:600;font-size:clamp(22px,4.6vw,30px);color:var(--rose-deep);
  opacity:0;transform:translateY(6px);transition:opacity 1s,transform 1s}
.sign.show{opacity:1;transform:none}
.corner{position:absolute;width:28px;height:auto;image-rendering:pixelated;pointer-events:none}
.corner.tl{top:9px;left:9px}.corner.tr{top:9px;right:9px}.corner.bl{bottom:9px;left:9px}.corner.br{bottom:9px;right:9px}
@media (orientation:landscape) and (max-height:520px){
  .card{width:min(760px,100%);grid-template-columns:auto 1fr;grid-template-areas:"bq head" "bq letter" "bq sign" "bq btn";
    column-gap:22px;justify-items:start;text-align:left;padding:18px 26px}
  .card-head{grid-area:head;padding-inline:0 26px}
  .bq{grid-area:bq;height:min(62vh,230px);align-self:center}
  .letter{grid-area:letter;max-width:none}
  .sign{grid-area:sign}
  #replayBtn{grid-area:btn}
  .corner.bl,.corner.tl{display:none}
}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  .title-art,.envelope canvas,.tap{animation:none}
  .card,.envelope,.banner{transition:none}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="180" aria-label="Màn chơi Hành Trình Hái Hoa"></canvas>
    <div id="banner" class="banner" aria-live="polite"><b id="bannerTitle"></b><small id="bannerSub"></small></div>
    <div id="hint" class="hint"></div>
    <button id="muteBtn" class="mute" type="button" aria-pressed="false" aria-label="Tắt nhạc">♪</button>
  </div>
</div>

<div id="controls" hidden>
  <div class="grp">
    <button class="pad" id="padL" type="button" aria-label="Sang trái"><svg viewBox="0 0 8 9" aria-hidden="true"><rect x="5" y="1" width="1" height="7"/><rect x="4" y="2" width="1" height="5"/><rect x="3" y="3" width="1" height="3"/><rect x="2" y="4" width="1" height="1"/></svg></button>
    <button class="pad" id="padR" type="button" aria-label="Sang phải"><svg viewBox="0 0 8 9" aria-hidden="true"><rect x="2" y="1" width="1" height="7"/><rect x="3" y="2" width="1" height="5"/><rect x="4" y="3" width="1" height="3"/><rect x="5" y="4" width="1" height="1"/></svg></button>
  </div>
  <div class="grp">
    <button class="pad jump" id="padJ" type="button" aria-label="Nhảy"><svg viewBox="0 0 9 8" aria-hidden="true"><rect x="4" y="2" width="1" height="1"/><rect x="3" y="3" width="3" height="1"/><rect x="2" y="4" width="5" height="1"/><rect x="1" y="5" width="7" height="1"/></svg></button>
  </div>
</div>

<div id="titleScreen" class="screen">
  <div class="panel">
    <canvas id="titleArt" class="title-art" width="76" height="40" aria-hidden="true"></canvas>
    <h1>Hành Trình Hái Hoa</h1>
    <p class="sub" id="titleSub">Món quà nhỏ ngày 20 · 10</p>
    <p class="goal">Hái thật nhiều hoa trên đường đi, rồi mang đến tặng người ấy nhé.</p>
    <button id="startBtn" class="btn" type="button">▶ Bắt đầu</button>
    <p class="keys" id="keysHint">← → di chuyển · Space nhảy</p>
    <p class="keys" id="rotateHint" hidden>Xoay ngang điện thoại để nhìn rộng hơn</p>
  </div>
</div>

<div id="endScreen" class="screen end" hidden>
  <button id="envelope" class="envelope" type="button" aria-label="Mở thư">
    <canvas id="envCanvas" width="54" height="60"></canvas>
    <span class="tap">Chạm để mở thư ✉</span>
  </button>
  <article id="card" class="card" hidden>
    <img class="corner tl" id="cTL" alt=""><img class="corner tr" id="cTR" alt="">
    <img class="corner bl" id="cBL" alt=""><img class="corner br" id="cBR" alt="">
    <h2 class="card-head" id="cardTitle"></h2>
    <canvas id="bqBig" class="bq" width="66" height="78" aria-hidden="true"></canvas>
    <p class="letter" id="letter"><span id="typed"></span><span id="rest" class="rest"></span></p>
    <p class="sign" id="sign"></p>
    <button id="replayBtn" class="btn small" type="button" hidden>↺ Chơi lại</button>
  </article>
</div>

<script>
'use strict';
const CONFIG = {
  letter: 'Những bông hoa xinh đẹp này dành tặng cho bông hoa xinh đẹp nhất ngày hôm nay',
  cardTitle: 'Chúc mừng ngày Phụ nữ Việt Nam 20/10',
  forName: '',
  signature: 'CatChau',
};

const W = 320, H = 180, LEVEL_W = 4400, STEP = 1 / 120;
const OUTLINE = '#160d1c', INK = '#2a1630';

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rgbCache = new Map();
function rgb(hex) {
  let v = rgbCache.get(hex);
  if (!v) { v = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; rgbCache.set(hex, v); }
  return v;
}
const mixA = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t];
const css = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (hex, a) => { const c = rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
function sampleKeys(keys, t) {
  if (t <= keys[0][0]) return rgb(keys[0][1]);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) return mixA(rgb(a[1]), rgb(b[1]), (t - a[0]) / (b[0] - a[0]));
  }
  return rgb(keys[keys.length - 1][1]);
}

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function outlined(src, color = OUTLINE) {
  const w = src.width, h = src.height;
  const sd = src.getContext('2d').getImageData(0, 0, w, h).data;
  const c = mk(w + 2, h + 2), x = c.getContext('2d');
  const img = x.createImageData(w + 2, h + 2), d = img.data;
  const oc = rgb(color);
  const on = (px, py) => px >= 0 && py >= 0 && px < w && py < h && sd[(py * w + px) * 4 + 3] > 0;
  for (let y = 0; y < h + 2; y++) for (let X = 0; X < w + 2; X++) {
    const sx = X - 1, sy = y - 1, o = (y * (w + 2) + X) * 4;
    if (on(sx, sy)) { const i = (sy * w + sx) * 4; d[o] = sd[i]; d[o + 1] = sd[i + 1]; d[o + 2] = sd[i + 2]; d[o + 3] = sd[i + 3]; }
    else if (on(sx - 1, sy) || on(sx + 1, sy) || on(sx, sy - 1) || on(sx, sy + 1)) { d[o] = oc[0]; d[o + 1] = oc[1]; d[o + 2] = oc[2]; d[o + 3] = 255; }
  }
  x.putImageData(img, 0, 0);
  return c;
}
function paint(rows, pal) {
  const c = mk(rows[0].length, rows.length), x = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch !== '.') { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); }
    }
  });
  return c;
}
const sprite = (rows, pal) => outlined(paint(rows, pal));
function flipped(src) {
  const c = mk(src.width, src.height), x = c.getContext('2d');
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0);
  return c;
}
const pair = s => ({ r: s, l: flipped(s) });
// Anchor is bottom-centre; the outline row lands on y so feet sit on the surface.
const blit = (c, s, x, y) => c.drawImage(s, Math.round(x - s.width / 2), Math.round(y - s.height + 1));
function disc(c, cx, cy, r, col) {
  c.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.floor(Math.sqrt(r * r - dy * dy) + 0.35);
    c.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2 + 1, 1);
  }
}

// ---------- characters (drawn from the two photos) ----------
const PAL_BOY = {
  h: '#2a2233', H: '#4a3d5c', s: '#f7d3b9', S: '#e3ad92', g: '#6a5878', e: '#120c16', r: '#f5a3a3',
  o: '#e9f1f7', m: '#c06470', t: '#2b2730', T: '#1c1920', G: '#b4e85a', c: '#c9c9d4', f: '#e8403a',
  d: '#7a6a80', p: '#4b5878', b: '#f4f4f6',
};
const BOY_HEAD = [
  '....h.hh..h...',
  '...hhhhhhhhh..',
  '..hhhHHHhhhhh.',
  '.hhhHHhhhhhhhh',
  'hhhhhhhhhhhhhh',
  'hhhhhhhhhhhhhh',
  'hhhhhhhsshshh.',
  'hhhhhhggggggg.',
  'hhhhssgegsgegs',
  'hhhhSssrsssrs.',
  'hhhhosssssmss.',
  '.hh...sssss...',
  '......SSs.....',
];
const BOY_BODY = [
  '...sttttttts..',
  '...stGGtGGtf..',
  '...stcGGGctd..',
  '...sttcctttS..',
  '...sttttttts..',
  '...sTTTTTTTs..',
];
const BOY_BODY_OFFER = [
  '...sttttttts..',
  '...stGGtGGtf..',
  '...stcGGGctsss',
  '...sttccttt...',
  '...sttttttt...',
  '...sTTTTTTT...',
];
const BOY_LEGS = {
  stand: ['....ppppppp...', '....ppp.ppp...', '....ppp.ppp...', '....bbbb.bbbb.'],
  a:     ['....ppppppp...', '...ppp...ppp..', '..ppp.....ppp.', '.bbbb.....bbbb'],
  b:     ['....ppppppp...', '.....ppppp....', '......ppp.....', '......bbbbb...'],
  c:     ['....ppppppp...', '....ppp..ppp..', '...ppp....ppp.', '..bbbb....bbbb'],
  jump:  ['....ppppppp...', '...ppp..ppp...', '...pp....ppp..', '..bbb.....bbbb'],
};
function boyRows(legs, offer, blink) {
  const head = BOY_HEAD.slice();
  if (blink) head[8] = head[8].replace(/e/g, 'S');
  return [...head, ...(offer ? BOY_BODY_OFFER : BOY_BODY), ...BOY_LEGS[legs]];
}
const BOY_SPR = {
  idle: pair(sprite(boyRows('stand'), PAL_BOY)),
  blink: pair(sprite(boyRows('stand', false, true), PAL_BOY)),
  a: pair(sprite(boyRows('a'), PAL_BOY)),
  b: pair(sprite(boyRows('b'), PAL_BOY)),
  c: pair(sprite(boyRows('c'), PAL_BOY)),
  jump: pair(sprite(boyRows('jump'), PAL_BOY)),
  offer: pair(sprite(boyRows('stand', true), PAL_BOY)),
};

const PAL_GIRL = {
  R: '#e0353a', Q: '#ff7468', D: '#a8202c', s: '#f7d3b9', S: '#e3ad92', g: '#6a5878', e: '#120c16',
  r: '#f5a3a3', m: '#c06470', M: '#8a3a4a', t: '#2b2730', w: '#f6f1f1', k: '#26222c', K: '#3d3847', b: '#f4f4f6',
};
const GIRL_ROWS = [
  '...RRRQQRR....',
  '..RRRQQRRRRR..',
  '.RRRRRRRRRRRR.',
  'RRRRRRRRRRRRRR',
  'RRRRRRRRRRRRRR',
  'RRRRRRRsRRsRRR',
  'RRRRRRgggsgggR',
  'RRRRRsgegggegR',
  'RRRRRssrsssrsR',
  'DRRRRsssssmssR',
  'DRRRRRsssssRR.',
  'DDRRRR.sss.RR.',
  'DRRRstttttsR..',
  'DRRRstwwttsR..',
  'DDRRsttwtts...',
  '.DRRstwwtts...',
  '..DDsssssss...',
  '...kkkkkkkk...',
  '..kkkkkkkkkk..',
  '..kkkKkkkKkkk.',
  '.kkkKkk.kKkkk.',
  '.kkkkkk.kkkkk.',
  '..bbbb...bbbb.',
];
function girlRows(mood, blink) {
  const r = GIRL_ROWS.slice();
  if (blink || mood === 'happy') r[7] = r[7].replace(/e/g, 'S');
  if (mood === 'surprised') r[9] = r[9].replace('m', 'M');

function fillPoly(x, pts, col) {
  x.fillStyle = col;

  for (let y = y0; y <= y1; y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) * (bx - ax) / (by - ay));
    }
    xs.sort((a, b) => a - b);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const a = Math.round(xs[i]), b = Math.round(xs[i + 1]);

  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;

    x.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;

    for (let bx = s.x0 + 24; bx < s.x1 - 24; bx += 50 + R() * 70) if (R() < 0.55) bush(x, Math.round(bx), s.top + 1, R);
  }

  for (const s of ground) {
    if (s.kind === 'grass') drawGrass(x, s, R);
    else if (s.kind === 'street') drawStreet(x, s, R);
    else if (s.kind === 'planter') drawPlanter(x, s, R);
    else if (s.kind === 'crate') drawCrate(x, s, R);
    else if (s.kind === 'rock') drawRock(x, s);
    else if (s.kind === 'bridge') drawBridge(x, s);

// ---------- state ----------
const canvas = $('game'), ctx = canvas.getContext('2d');
const ent = mk(W, H), ex = ent.getContext('2d');
ctx.imageSmoothingEnabled = false; ex.imageSmoothingEnabled = false;
const LEVEL = buildLevel();
const TOTAL = flowers.length;

let state = 'title', time = 0, cam = 0, skyT = 0, night = 0, warm = 0;
let count = 0, zoneIdx = -1, hudPulse = 0, sparkleT = 0, petalT = 0, catHeart = false;
const collected = [];
const P = { x: 60, y: 150, vx: 0, vy: 0, onGround: true, on: null, face: 1, coyote: 0, jumpBuf: 0, cut: false, walkT: 0, offer: false, dead: 0, blinkT: 0 };
const safe = { x: 60, y: 150 };
const keys = { left: false, right: false, jump: false };
let jumpPressed = false;
const parts = [], flyers = [], bubbles = [], rockets = [];
let fireworksOn = false, fwTimer = 0, gift = null, bouquetSmall = null;
const END = { t: 0, a: 0, arrived: false, done: {} };

const MAXV = 92, ACC = 1000, AIRACC = 720, FRIC = 1100, GRAV = 980, JUMPV = 322, MAXFALL = 340, HW = 4, PH = 20;

const BUTTERFLIES = [180, 430, 700, 980, 1240].map((x, i) => ({ x, bx: x, y: 120, by: 118 + (i * 7) % 16, ph: i * 1.7, col: i % 3 }));
const FIREFLIES = Array.from({ length: 16 }, (_, i) => ({ x: 0, y: 0, ph: i * 0.9, init: false }));
const STARS = Array.from({ length: 60 }, (_, i) => [hash(i * 9.1) * W | 0, hash(i * 4.3) * 108 | 0, hash(i * 1.9) * 6]);
const CLOUDS = Array.from({ length: 7 }, (_, i) => ({ x: i * 62 + hash(i) * 40, y: 14 + hash(i * 2) * 42 | 0, s: 0.6 + hash(i * 3) * 0.7 }));
const FW_COLS = ['#ff5c8a', '#ffd36b', '#8fe3ff', '#c69cff', '#7dffb0', '#ff9a5c'];

function emit(o) {
  if (parts.length > 700) return;
  const p = Object.assign({ vx: 0, vy: 0, g: 0, drag: 0, life: 0.6, c: '#ffffff', kind: 'px', ph: Math.random() * 6 }, o);
  p.max = p.life; parts.push(p);
}
const bubble = (who, kind, dur) => bubbles.push({ who, kind, t: 0, dur });

// ---------- physics ----------
function physics(dt, L, R, held, pressed) {
  const dir = (R ? 1 : 0) - (L ? 1 : 0);
  if (dir) {
    P.vx += dir * (P.onGround ? ACC : AIRACC) * dt;
    if (Math.sign(P.vx) === -dir) P.vx += dir * FRIC * dt * 0.6;
    P.face = dir;
  } else {
    const f = (P.onGround ? FRIC : 280) * dt;
    P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f;
  }
  P.vx = clamp(P.vx, -MAXV, MAXV);
  P.coyote = P.onGround ? 0.1 : P.coyote - dt;
  P.jumpBuf = pressed ? 0.13 : P.jumpBuf - dt;
  if (P.jumpBuf > 0 && P.coyote > 0) {
    P.vy = -JUMPV; P.jumpBuf = 0; P.coyote = 0; P.onGround = false; P.cut = false;
    Snd.jump();
    for (let i = 0; i < 4; i++) emit({ x: P.x + (Math.random() * 8 - 4), y: P.y - 1, vx: Math.random() * 30 - 15, vy: -Math.random() * 20, life: 0.3, c: '#efe6d8' });
  }
  if (!held && P.vy < -120 && !P.cut) { P.vy = -120; P.cut = true; }
  P.vy = Math.min(P.vy + GRAV * dt, MAXFALL);

  P.x += P.vx * dt;
  for (const s of ground) {
    if (P.y > s.top + 0.01 && P.x + HW > s.x0 && P.x - HW < s.x1) {
      P.x = (P.vx > 0 || P.x < (s.x0 + s.x1) / 2) ? s.x0 - HW : s.x1 + HW;
      P.vx = 0;
    }
  }
  P.x = clamp(P.x, 8, LEVEL_W - 8);

  const prevY = P.y, wasAir = !P.onGround, fallV = P.vy;
  P.y += P.vy * dt;
  P.onGround = false; P.on = null;
  if (P.vy >= 0) {
    for (const s of [...ground, ...plats]) {
      if (P.x + HW > s.x0 && P.x - HW < s.x1 && prevY <= s.top + 0.5 && P.y >= s.top) {
        P.y = s.top; P.vy = 0; P.onGround = true; P.on = s;
      }
    }
  }
  if (P.onGround && wasAir && fallV > 200) {
    for (let i = 0; i < 5; i++) emit({ x: P.x + (Math.random() * 10 - 5), y: P.y - 1, vx: Math.random() * 40 - 20, vy: -Math.random() * 15, life: 0.3, c: '#efe6d8' });
  }
  if (P.onGround && P.on) { safe.x = clamp(P.x, P.on.x0 + 8, P.on.x1 - 8); safe.y = P.on.top; }
  if (P.onGround && Math.abs(P.vx) > 8) P.walkT += Math.abs(P.vx) * dt; else if (P.onGround) P.walkT = 0;
}

// ---------- updates ----------
function collect(f) {
  f.got = true; count++; collected.push(f.type); hudPulse = 0.25;
  Snd.pick(count - 1);
  flyers.push({ t: 0, x0: f.x - Math.round(cam), y0: f.y - 12, type: f.type });
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * 6.28, s = 30 + Math.random() * 40;
    emit({ x: f.x, y: f.y - 8, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, g: 60, drag: 2, life: 0.5 + Math.random() * 0.3, c: ['#fff6c8', '#ffd3df', '#ffffff'][i % 3] });
  }
  emit({ x: f.x - 2, y: f.y - 14, vy: -22, life: 0.9, kind: 'heart' });
}

function updatePlay(dt) {
  if (P.dead > 0) {
    P.dead -= dt;
    if (P.dead <= 0) { P.x = safe.x; P.y = safe.y; P.vx = P.vy = 0; P.blinkT = 1; P.onGround = true; }
    return;
  }
  physics(dt, keys.left, keys.right, keys.jump, jumpPressed);
  jumpPressed = false;
  if (P.blinkT > 0) P.blinkT -= dt;
  for (const f of flowers) {
    if (f.got || Math.abs(f.x - P.x) > 10) continue;
    if (P.y > f.y - 16 && P.y - PH < f.y) collect(f);
  }
  const z = P.x < ZONES[1].x ? 0 : P.x < ZONES[2].x ? 1 : 2;
  if (z !== zoneIdx) { zoneIdx = z; showBanner(z); }
  if (P.y > 168) {
    P.dead = 0.6; Snd.splash();
    for (let i = 0; i < 14; i++) emit({ x: P.x + Math.random() * 10 - 5, y: 156, vx: Math.random() * 60 - 30, vy: -60 - Math.random() * 70, g: 300, life: 0.7, c: i % 2 ? '#bfe8fa' : '#ffffff' });
  }
  if (!catHeart && Math.abs(P.x - CAT_POS.x) < 14 && P.onGround) {
    catHeart = true; Snd.meow(); emit({ x: CAT_POS.x - 2, y: CAT_POS.y - 12, vy: -18, life: 1.2, kind: 'heart' });
  }
  if (P.x >= ENDING_X && P.onGround) startEnding();
}

function startEnding() {
  state = 'ending'; END.t = 0; END.a = 0; END.arrived = false; END.done = {};
  keys.left = keys.right = keys.jump = false;
  document.querySelectorAll('.pad.on').forEach(b => b.classList.remove('on'));
}
const once = (k, at, fn) => { if (!END.done[k] && END.a >= at) { END.done[k] = true; fn(); } };

function updateEnding(dt) {
  END.t += dt;
  const tx = GIRL.x - 26;
  if (!END.arrived) {
    const go = P.x < tx;
    physics(dt, false, go, false, false);
    if ((!go && P.onGround && Math.abs(P.vx) < 1) || END.t > 6) {
      END.arrived = true; P.vx = 0; P.face = 1;
      if (END.t > 6) { P.x = tx; P.y = 150; }
    }
    return;
  }
  physics(dt, false, false, false, false);
  P.face = 1;
  END.a += dt;
  once('see', 0.3, () => { GIRL.mood = 'surprised'; bubble('girl', '!', 1.0); Snd.pop(); });
  once('offer', 1.3, () => { bouquetSmall = makeBouquet(collected, false); P.offer = true; bubble('boy', 'heart', 1.0); Snd.pop(); });
  once('give', 2.5, () => { P.offer = false; gift = { t: 0 }; });
  once('got', 3.25, () => {
    gift = null; GIRL.holding = true; GIRL.mood = 'happy'; Snd.chime(); fireworksOn = true; fwTimer = 0.2;
    bubble('girl', 'hearts', 1.8);
    for (let i = 0; i < 12; i++) emit({ x: GIRL.x + Math.random() * 20 - 10, y: GIRL.y - 14 - Math.random() * 10, vx: Math.random() * 30 - 15, vy: -20 - Math.random() * 30, life: 1 + Math.random() * 0.8, kind: 'heart' });
  });
  once('card', 5.3, showEnvelope);
}

function updateCamera(dt) {
  let target;
  if (state === 'title') target = 0;
  else if (state === 'play') target = P.x - W / 2 + P.face * 24;
  else target = (P.x + GIRL.x) / 2 - W / 2;
  target = clamp(target, 0, LEVEL_W - W);
  cam += (target - cam) * (1 - Math.exp(-5 * dt));
  skyT = clamp((cam + W / 2) / (LEVEL_W - W / 2), 0, 1);
  night = smooth(0.66, 0.88, skyT);
  warm = Math.exp(-(((skyT - 0.56) / 0.12) ** 2));
}

function updateFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt;
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'petal') p.x += Math.sin(time * 3 + p.ph) * 14 * dt;

[['cTL', 'rose'], ['cTR', 'daisy'], ['cBL', 'tulip'], ['cBR', 'lotus']].forEach(([id, k]) => { $(id).src = HEADS[k].toDataURL(); });

(function titleArt() {
  const c = $('titleArt'), x = c.getContext('2d');
  x.fillStyle = '#5cb947'; x.fillRect(0, 36, 76, 4); x.fillStyle = '#86d96a'; x.fillRect(0, 36, 76, 1);
  blit(x, FL.daisy, 6, 36); blit(x, FL.tulip, 70, 36); blit(x, FL.rose, 38, 36);
  blit(x, BOY_SPR.idle.r, 22, 36); blit(x, GIRL_SPR.idle.l, 54, 36);
  x.drawImage(HEART_L, 34, 6);
})();

function layout() {
  const portrait = innerHeight > innerWidth;
  document.documentElement.style.setProperty('--ctrl-h', (isTouch && portrait ? 170 : 0) + 'px');
  const cs = getComputedStyle(wrap);
  const aw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.max(0.5, Math.min(aw / W, ah / H));
  const dpr = window.devicePixelRatio || 1, crisp = Math.floor(s * dpr) / dpr;
  if (crisp >= s * 0.97) s = crisp;
  stage.style.width = W * s + 'px'; stage.style.height = H * s + 'px';
  stage.style.setProperty('--u', s + 'px');
  $('rotateHint').hidden = !(isTouch && portrait);
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();

let bannerTimer = 0;
function showBanner(z) {
  $('bannerTitle').textContent = ZONES[z].title; $('bannerSub').textContent = ZONES[z].sub;
  banner.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => banner.classList.remove('show'), 2600);
}
function showHint() {
  hint.textContent = isTouch ? 'Giữ ◀ ▶ để đi · chạm ▲ để nhảy' : '← → để đi · Space để nhảy';
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 6000);
}

function startGame() {
  Snd.init();
  titleScreen.hidden = true;
  startBtn.blur();
  state = 'play';
  showHint();
}
startBtn.addEventListener('click', startGame);

function showEnvelope() {
  state = 'card';
  drawEnvelope(envCanvas, 0, 0);
  envBtn.hidden = false; envBtn.classList.remove('opening');
  endScreen.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => endScreen.classList.add('show')));
  setTimeout(() => envBtn.focus({ preventScroll: true }), 400);
}
let opening = false;
envBtn.addEventListener('click', () => {
  if (opening) return;
  opening = true; envBtn.classList.add('opening');
  Snd.open(); Snd.setMode('box');
  const t0 = performance.now();
  (function anim(now) {
    const t = (now - t0) / 1000;
    drawEnvelope(envCanvas, clamp(t / 0.45, 0, 1), clamp((t - 0.45) / 0.65, 0, 1));
    if (t < 1.25) requestAnimationFrame(anim);
    else showCard();
  })(t0);
});

let typing = null, letterChars = [];
function showCard() {
  envBtn.hidden = true;
  const bq = makeBouquet(collected, true), big = $('bqBig');
  big.width = bq.width; big.height = bq.height; big.getContext('2d').drawImage(bq, 0, 0);
  card.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('show')));
  setTimeout(startTyping, 700);
}
function startTyping() {
  letterChars = Array.from(CONFIG.letter.normalize('NFC'));
  let i = 0;
  typedEl.textContent = ''; restEl.textContent = letterChars.join('');
  letterEl.classList.add('typing');
  typing = setInterval(() => {
    i++;
    typedEl.textContent = letterChars.slice(0, i).join(''); restEl.textContent = letterChars.slice(i).join('');
    if (letterChars[i - 1] !== ' ' && i % 2) Snd.blip();
    if (i >= letterChars.length) finishTyping();
  }, 62);
}
function finishTyping() {
  if (!typing) return;
  clearInterval(typing); typing = null;
  typedEl.textContent = letterChars.join(''); restEl.textContent = '';
  letterEl.classList.remove('typing');
  signEl.classList.add('show');
  setTimeout(() => { replayBtn.hidden = false; }, 900);
  Snd.chime();
}
card.addEventListener('click', e => { if (typing && e.target !== replayBtn) finishTyping(); });

replayBtn.addEventListener('click', () => {
  endScreen.classList.remove('show'); endScreen.hidden = true;
  card.classList.remove('show'); card.hidden = true; replayBtn.hidden = true;
  signEl.classList.remove('show'); typedEl.textContent = ''; restEl.textContent = '';
  opening = false;
  flowers.forEach(f => { f.got = false; });
  count = 0; collected.length = 0; zoneIdx = -1; catHeart = false;
  Object.assign(P, { x: 60, y: 150, vx: 0, vy: 0, face: 1, offer: false, dead: 0, blinkT: 0, onGround: true });
  safe.x = 60; safe.y = 150;
  Object.assign(GIRL, { mood: 'idle', holding: false });
  fireworksOn = false; rockets.length = 0; parts.length = 0; bubbles.length = 0; flyers.length = 0; gift = null; bouquetSmall = null;
  cam = 0; state = 'play';
  Snd.setMode('play');
  replayBtn.blur();
});

const muteBtn = $('muteBtn');
muteBtn.addEventListener('click', () => {
  const m = muteBtn.getAttribute('aria-pressed') !== 'true';
  muteBtn.setAttribute('aria-pressed', String(m));
  muteBtn.setAttribute('aria-label', m ? 'Bật nhạc' : 'Tắt nhạc');
  Snd.setMuted(m);
  muteBtn.blur();
});
document.addEventListener('visibilitychange', () => Snd.pause(document.hidden));

// ---------- input ----------
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'jump', w: 'jump', W: 'jump', ' ': 'jump', z: 'jump', Z: 'jump', k: 'jump' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;
  if (state === 'play' || state === 'ending') e.preventDefault();
  if (k === 'jump' && !keys.jump && !e.repeat) jumpPressed = true;
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
function bindPad(id, k) {
  const el = $(id);
  const on = e => {
    e.preventDefault();
    if (state !== 'play') return;
    if (k === 'jump' && !keys.jump) jumpPressed = true;
    keys[k] = true; el.classList.add('on');
  };
  const off = () => { keys[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.addEventListener(t, off));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bindPad('padL', 'left'); bindPad('padR', 'right'); bindPad('padJ', 'jump');

// ---------- loop ----------
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now; acc += dt;
  while (acc >= STEP) { fixedUpdate(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
startBtn.focus({ preventScroll: true });
</script>
</body>
