<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mười Bông Hoa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=VT323&display=swap">
<style>
:root{
  /* One committed look: night garden around a pixel canvas, paper cards with hard ink shadows */
  --ink:#2a1630;
  --night:#170f2b;
  --dusk:#2a1c48;
  --paper:#fff7ef;
  --blush:#ffd3df;
  --rose:#e2456f;
  --rose-hi:#ee6088;
  --rose-deep:#b82d55;
  --gold:#ffd36b;
  --muted:#7a5a72;
  --f-pixel:'VT323', ui-monospace, 'Courier New', monospace;
  --f-script:'Dancing Script', 'Segoe Script', 'Apple Chancery', cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--f-pixel);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(env(safe-area-inset-bottom,0px) + var(--ctrl-h,0px));
  background:radial-gradient(ellipse at 50% 40%,var(--dusk) 0%,var(--night) 70%)}
#stage{position:relative;width:320px;height:180px;--u:1px;box-shadow:0 0 0 2px var(--ink),0 18px 50px rgba(0,0,0,.45)}
#game{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none}

.banner{position:absolute;left:50%;top:17%;transform:translate(-50%,-8px);opacity:0;transition:opacity .5s ease,transform .5s ease;
  pointer-events:none;text-align:center;white-space:nowrap;background:var(--paper);color:var(--ink);
  border:max(2px,calc(var(--u)*1)) solid var(--ink);box-shadow:max(3px,calc(var(--u)*2)) max(3px,calc(var(--u)*2)) 0 var(--ink);
  padding:max(2px,calc(var(--u)*1.5)) max(10px,calc(var(--u)*8))}
.banner.show{opacity:1;transform:translate(-50%,0)}
.banner b{display:block;font-weight:400;font-size:max(18px,calc(var(--u)*13));line-height:1;color:var(--rose-deep)}
.banner small{display:block;font-size:max(13px,calc(var(--u)*7));line-height:1.1;letter-spacing:.06em;text-transform:uppercase}
.hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap;
  font-size:max(15px,calc(var(--u)*8));color:var(--paper);text-shadow:2px 2px 0 var(--ink);padding:0 8px;background:rgba(42,22,48,.45)}
.hint.show{opacity:1}
.mute{position:absolute;top:max(4px,calc(var(--u)*3));right:max(4px,calc(var(--u)*3));
  width:max(30px,calc(var(--u)*13));height:max(30px,calc(var(--u)*13));display:grid;place-items:center;padding:0;cursor:pointer;
  background:rgba(255,247,239,.85);color:var(--ink);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
  font-size:max(18px,calc(var(--u)*9));line-height:1}
.mute[aria-pressed="true"]{background:rgba(255,247,239,.45);text-decoration:line-through}

#controls{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(16px + env(safe-area-inset-bottom,0px))}
.stick{position:relative;width:120px;height:120px;border-radius:50%;pointer-events:auto;touch-action:none;
  background:rgba(255,247,239,.14);border:3px solid rgba(255,247,239,.6);box-shadow:0 4px 0 rgba(42,22,48,.6)}
.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;pointer-events:none;
  background:rgba(255,247,239,.8);border:3px solid var(--ink)}
.atk{width:84px;height:84px;border-radius:50%;pointer-events:auto;touch-action:none;display:grid;place-items:center;padding:0;cursor:pointer;
  background:rgba(226,69,111,.55);color:var(--paper);border:3px solid rgba(255,247,239,.8);box-shadow:0 5px 0 rgba(42,22,48,.7)}
.atk.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(42,22,48,.7);background:rgba(226,69,111,.85)}
.atk svg{width:40px;height:40px;shape-rendering:crispEdges;fill:currentColor}
@media (orientation:portrait){
  .stick{width:140px;height:140px}
  .atk{width:100px;height:100px}
  #controls{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
}
@media (orientation:landscape) and (max-height:500px){
  .stick{width:96px;height:96px}
  .knob{width:40px;height:40px;margin:-20px 0 0 -20px}
  .atk{width:72px;height:72px}
  .atk svg{width:32px;height:32px}
  #controls{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
.say{position:absolute;left:5%;right:5%;bottom:5%;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;
  background:var(--paper);color:var(--ink);border:max(2px,calc(var(--u)*1)) solid var(--ink);
  box-shadow:max(3px,calc(var(--u)*2)) max(3px,calc(var(--u)*2)) 0 var(--ink);
  padding:max(4px,calc(var(--u)*2.5)) max(8px,calc(var(--u)*6));font-size:max(16px,calc(var(--u)*9));line-height:1.1;text-wrap:balance}
.say.show{opacity:1}
.screen{position:fixed;inset:0;z-index:10;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  background:rgba(23,15,43,.5)}
.panel{width:min(440px,100%);display:grid;justify-items:center;gap:10px;text-align:center;padding:22px 22px 18px;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:inset 0 0 0 3px var(--blush),6px 6px 0 var(--ink)}
.title-art{height:clamp(84px,24vh,150px);width:auto;max-width:100%;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite}
.panel h1{margin:0;font-weight:400;font-size:clamp(40px,9vw,60px);line-height:.85;color:var(--rose);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.panel .sub{margin:0;font-size:clamp(20px,4.5vw,26px);line-height:1;color:var(--rose-deep);letter-spacing:.04em}
.panel .goal{margin:0;font-size:clamp(18px,4vw,22px);line-height:1.1;max-width:30ch;text-wrap:balance}
.panel .keys{margin:0;font-size:18px;line-height:1.1;color:var(--muted)}
.btn{background:var(--rose);color:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:6px 26px 4px;
  font-size:30px;line-height:1;cursor:pointer;text-shadow:2px 2px 0 var(--rose-deep)}
.btn:hover{background:var(--rose-hi)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.small{font-size:24px;padding:4px 18px 2px;margin-top:4px}
@media (max-height:460px){
  .panel{gap:6px;padding:12px 18px}
  .title-art{height:70px}
  .panel h1{font-size:40px}
}

.end{background:rgba(23,15,43,0);transition:background .8s}
.end.show{background:rgba(23,15,43,.55)}

.card{position:relative;width:min(540px,100%);max-height:100%;overflow:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text;
  display:grid;justify-items:center;gap:10px;text-align:center;padding:30px 30px 22px;
  background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px var(--blush),8px 8px 0 var(--ink);
  opacity:0;transform:translateY(24px) scale(.9);transition:opacity .7s ease,transform .7s cubic-bezier(.2,1.3,.4,1)}
.card.show{opacity:1;transform:none}
.card-head{margin:0;font-weight:400;font-size:clamp(20px,4.6vw,28px);line-height:1;color:var(--rose-deep);letter-spacing:.03em;text-wrap:balance;padding-inline:26px}
.bq{height:clamp(100px,24vh,200px);width:auto;max-width:100%;image-rendering:pixelated}
.letter{margin:0;font-family:var(--f-script);font-weight:700;font-size:clamp(25px,5.6vw,36px);line-height:1.4;color:var(--ink);max-width:24ch;text-wrap:balance}
.letter .rest{visibility:hidden}
.letter.typing #typed::after{content:"";display:inline-block;width:.08em;height:.9em;margin-left:2px;vertical-align:-.1em;background:var(--rose);animation:blink .8s steps(2,start) infinite}
.sign{margin:0;justify-self:end;font-family:var(--f-script);font-weight:600;font-size:clamp(22px,4.6vw,30px);color:var(--rose-deep);
  opacity:0;transform:translateY(6px);transition:opacity 1s,transform 1s}
.sign.show{opacity:1;transform:none}
.corner{position:absolute;width:28px;height:auto;image-rendering:pixelated;pointer-events:none}
.corner.tl{top:9px;left:9px}.corner.tr{top:9px;right:9px}.corner.bl{bottom:9px;left:9px}.corner.br{bottom:9px;right:9px}
@media (orientation:landscape) and (max-height:520px){
  .card{width:min(760px,100%);grid-template-columns:auto 1fr;grid-template-areas:"bq head" "bq letter" "bq sign" "bq btn";
    column-gap:22px;justify-items:start;text-align:left;padding:18px 26px}
  .card-head{grid-area:head;padding-inline:0 26px}
  .bq{grid-area:bq;height:min(62vh,230px);align-self:center}
  .letter{grid-area:letter;max-width:none}
  .sign{grid-area:sign}
  #replayBtn{grid-area:btn}
  .corner.bl,.corner.tl{display:none}
}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  .title-art{animation:none}
  .card,.banner,.say{transition:none}
}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="320" height="180" aria-label="Màn chơi Hành Trình Hái Hoa"></canvas>
    <div id="banner" class="banner" aria-live="polite"><b id="bannerTitle"></b><small id="bannerSub"></small></div>
    <div id="hint" class="hint"></div>
    <div id="say" class="say" aria-live="polite"></div>
    <button id="muteBtn" class="mute" type="button" aria-pressed="false" aria-label="Tắt nhạc">♪</button>
  </div>
</div>

<div id="controls" hidden>
  <div class="stick" id="stick" role="group" aria-label="Cần điều khiển"><div class="knob" id="knob"></div></div>
  <button class="atk" id="atkBtn" type="button" aria-label="Chém"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="8" y="1" width="2" height="1"/><rect x="7" y="2" width="2" height="1"/><rect x="6" y="3" width="2" height="1"/><rect x="5" y="4" width="2" height="1"/><rect x="2" y="4" width="2" height="1"/><rect x="3" y="5" width="3" height="1"/><rect x="4" y="6" width="2" height="1"/><rect x="2" y="7" width="2" height="1"/><rect x="1" y="8" width="2" height="1"/></svg></button>
</div>

<div id="titleScreen" class="screen">
  <div class="panel">
    <canvas id="titleArt" class="title-art" width="76" height="40" aria-hidden="true"></canvas>
    <h1>Mười Bông Hoa</h1>
    <p class="sub" id="titleSub">Chuyến phiêu lưu nhỏ ngày 20 · 10</p>
    <p class="goal">Đi từ sáng đến tối: hái đủ 10 bông hoa, vượt qua lũ quái nhỏ, rồi tìm người ấy nhé.</p>
    <button id="startBtn" class="btn" type="button">▶ Bắt đầu</button>
    <p class="keys" id="keysHint">Phím mũi tên để đi · J hoặc Space để chém</p>
    <p class="keys" id="rotateHint" hidden>Xoay ngang điện thoại để nhìn rộng hơn</p>
  </div>
</div>

<div id="endScreen" class="screen end" hidden>
  <article id="card" class="card" hidden>
    <img class="corner tl" id="cTL" alt=""><img class="corner tr" id="cTR" alt="">
    <img class="corner bl" id="cBL" alt=""><img class="corner br" id="cBR" alt="">
    <h2 class="card-head" id="cardTitle"></h2>
    <canvas id="bqBig" class="bq" width="66" height="78" aria-hidden="true"></canvas>
    <p class="letter" id="letter"><span id="typed"></span><span id="rest" class="rest"></span></p>
    <p class="sign" id="sign"></p>
    <button id="replayBtn" class="btn small" type="button" hidden>↺ Chơi lại</button>
  </article>
</div>

<script>
'use strict';
const CONFIG = {
  letter: 'Những bông hoa xinh đẹp này dành tặng cho bông hoa xinh đẹp nhất ngày hôm nay',
  cardTitle: 'Chúc mừng ngày Phụ nữ Việt Nam 20/10',
  forName: '',
  signature: 'CatChau',
};

const W = 320, H = 180, STEP = 1 / 120;
const OUTLINE = '#160d1c', INK = '#2a1630';

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rgbCache = new Map();
function rgb(hex) {
  let v = rgbCache.get(hex);
  if (!v) { v = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; rgbCache.set(hex, v); }
  return v;
}
const mixA = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t];
const css = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (hex, a) => { const c = rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
function sampleKeys(keys, t) {
  if (t <= keys[0][0]) return rgb(keys[0][1]);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) return mixA(rgb(a[1]), rgb(b[1]), (t - a[0]) / (b[0] - a[0]));
  }
  return rgb(keys[keys.length - 1][1]);
}

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function outlined(src, color = OUTLINE) {
  const w = src.width, h = src.height;
  const sd = src.getContext('2d').getImageData(0, 0, w, h).data;
  const c = mk(w + 2, h + 2), x = c.getContext('2d');
  const img = x.createImageData(w + 2, h + 2), d = img.data;
  const oc = rgb(color);
  const on = (px, py) => px >= 0 && py >= 0 && px < w && py < h && sd[(py * w + px) * 4 + 3] > 0;
  for (let y = 0; y < h + 2; y++) for (let X = 0; X < w + 2; X++) {
    const sx = X - 1, sy = y - 1, o = (y * (w + 2) + X) * 4;
    if (on(sx, sy)) { const i = (sy * w + sx) * 4; d[o] = sd[i]; d[o + 1] = sd[i + 1]; d[o + 2] = sd[i + 2]; d[o + 3] = sd[i + 3]; }
    else if (on(sx - 1, sy) || on(sx + 1, sy) || on(sx, sy - 1) || on(sx, sy + 1)) { d[o] = oc[0]; d[o + 1] = oc[1]; d[o + 2] = oc[2]; d[o + 3] = 255; }
  }
  x.putImageData(img, 0, 0);
  return c;
}
function paint(rows, pal) {
  const c = mk(rows[0].length, rows.length), x = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let i = 0; i < row.length; i++) {
      const ch = row[i];
      if (ch !== '.') { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); }
    }
  });
  return c;
}
const sprite = (rows, pal) => outlined(paint(rows, pal));
function flipped(src) {
  const c = mk(src.width, src.height), x = c.getContext('2d');
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0);
  return c;
}
const pair = s => ({ r: s, l: flipped(s) });
// Anchor is bottom-centre; the outline row lands on y so feet sit on the surface.
const blit = (c, s, x, y) => c.drawImage(s, Math.round(x - s.width / 2), Math.round(y - s.height + 1));
function disc(c, cx, cy, r, col) {
  c.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) {
    const hw = Math.floor(Math.sqrt(r * r - dy * dy) + 0.35);
    c.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2 + 1, 1);
  }
}

// ---------- flowers ----------
const PAL_FL = {
  w: '#ffffff', y: '#ffd23f', Y: '#e0901a', g: '#3f9a4a', l: '#62c45a', T: '#ff5d8f', U: '#d6336c', u: '#ffa3c0',
  n: '#8a5426', N: '#5a3416', R: '#e8314a', r: '#ff7b8c', D: '#a81e33', L: '#ffe0ec', P: '#ff8fb8', p: '#e0608f',
};
const FLOWER_ROWS = {
  daisy: ['..w.w..', '.wwwww.', 'wwyyyww', '.wyYyw.', 'wwyyyww', '.wwwww.', '..w.w..',
    '...g...', '.l.g...', '.llg.l.', '...gll.', '...g...'],
  tulip: ['.T.T.T.', '.TuTTT.', '.TuTUT.', '.TTTUT.', '..TTT..',
    '...g...', '.l.g...', '.llg.l.', '...gll.', '...g...'],
  sunflower: ['..y.y.y..', '.yyyyyyy.', 'yyynnnyyy', '.ynNnNny.', 'yynnNnnyy', '.ynNnNny.', 'yyynnnyyy', '.yyyyyyy.', '..y.y.y..',
    '....g....', '..llg....', '...lg.ll.', '....gll..', '....g....', '....g....'],
  rose: ['.RRR.', 'RrRDR', 'RDrRR', 'lRRRl', '.lgl.', '..g..', '..gl.', '.lg..', '..g..'],
  lotus: ['...L...', '..LPL..', '.pLPLp.', 'pPPLPPp', '.pPPPp.', '..ppp..'],
};
const HEAD_ROWS = { daisy: 7, tulip: 5, sunflower: 9, rose: 4, lotus: 6 };
const MINI_ROWS = {
  daisy: ['.www.', 'wwyww', 'wyYyw', 'wwyww', '.www.'],
  tulip: ['T.T.T', 'TuTUT', 'TTTUT', '.TTT.'],
  sunflower: ['.yyy.', 'ynNny', 'yNnNy', 'ynNny', '.yyy.'],
  rose: ['.RRR.', 'RrRDR', 'RDrRR', '.RRR.'],
  lotus: ['..L..', '.LPL.', 'pPLPp', '.pPp.'],
};
const FL = {}, HEADS = {}, MINI = {};
for (const k in FLOWER_ROWS) {
  FL[k] = sprite(FLOWER_ROWS[k], PAL_FL);
  HEADS[k] = sprite(FLOWER_ROWS[k].slice(0, HEAD_ROWS[k]), PAL_FL);
  MINI[k] = paint(MINI_ROWS[k], PAL_FL);
}
const MINI_OUT = {};
for (const k in MINI) MINI_OUT[k] = outlined(MINI[k]);

const HEART_S = paint(['hh.hh', 'hhhhh', '.hhh.', '..h..'], { h: '#ff4f7a' });
const HEART_L = sprite(['.hh.hh.', 'hwhhhhh', 'hhhhhhh', '.hhhhh.', '..hhh..', '...h...'], { h: '#ff4f7a', w: '#ffc2d1' });

const PAL_CAT = { k: '#8d8a9c', y: '#ffd23f' };
const CAT_ROWS = ['....k.k.', '....kkkk', '....kyky', 'k...kkkk', 'k..kkkk.', '.kkkkkk.', '..kk.kk.'];
const CAT = pair(sprite(CAT_ROWS, PAL_CAT));
const CAT_BLINK = pair(sprite(CAT_ROWS.map((r, i) => i === 2 ? r.replace(/y/g, 'k') : r), PAL_CAT));

const BUTTERFLY = ['#ff9ec4', '#ffe066', '#9ad8ff'].map(col => [
  paint(['cc.cc', 'cCbCc', '.c.c.'], { c: col, C: '#ffffff', b: '#3a2a3a' }),
  paint(['.cbc.', '.cbc.', '..b..'], { c: col, b: '#3a2a3a' }),
]);

function makeBubble(kind) {
  const c = mk(11, 11), x = c.getContext('2d');
  x.fillStyle = '#ffffff';
  x.fillRect(1, 0, 9, 9); x.fillRect(0, 1, 11, 7); x.fillRect(4, 9, 3, 1); x.fillRect(5, 10, 1, 1);
  if (kind === '!') { x.fillStyle = '#e8314a'; x.fillRect(5, 1, 1, 4); x.fillRect(5, 6, 1, 1); }
  else if (kind === 'heart') x.drawImage(HEART_S, 3, 2);
  else { x.drawImage(HEART_S, 0, 1); x.drawImage(HEART_S, 6, 4); }
  return outlined(c);
}

// Scanline fill so envelope edges stay hard pixels instead of anti-aliased paths.
function fillPoly(x, pts, col) {
  x.fillStyle = col;

  for (let y = y0; y <= y1; y++) {

    for (let i = 0; i < pts.length; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % pts.length];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) * (bx - ax) / (by - ay));
    }
    xs.sort((a, b) => a - b);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const a = Math.round(xs[i]), b = Math.round(xs[i + 1]);

}

  x.fillStyle = col;

  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;

    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

}

}

  else if (P.y < 7) dy = -1; else if (P.y > RH - 1) dy = 1;

}

// ---------- player ----------
function hurt(from) {

  P.kbx = dx / d * 160; P.kby = dy / d * 160; P.kbT = 0.16;

}
function attackHits() {

  for (const e of enemies) {

    e.hitSwing = P.swing; e.hp--; e.flash = 0.14; Snd.hit();

function updatePlayer(dt) {

// ---------- enemies ----------
function updateEnemy(e, dt) {

    e.kb -= dt;
    if (flying) { e.x += e.kbx * dt; e.y += e.kby * dt; } else { walk(e, e.kbx * dt, 0, 5, 6, false); walk(e, 0, e.kby * dt, 5, 6, false); }
  } else {
    const dx = P.x - e.x, dy = (P.y - 6) - (e.y - 4), d = Math.hypot(dx, dy) || 1;
    if (!flying) {
      e.timer -= dt;
      if (e.timer <= 0) {
        e.moving = !e.moving; e.timer = e.moving ? 0.55 : 0.45 + Math.random() * 0.45;
        if (e.moving) {
          if (d < 110) { e.vx = dx / d * 34; e.vy = dy / d * 34; }
          else { const a = Math.random() * 6.28; e.vx = Math.cos(a) * 22; e.vy = Math.sin(a) * 22; }
        }

        const ox = e.x, oy = e.y;

        if (!boxHits(room, e.x, e.y + e.vy * dt, 5, 6, true)) e.y += e.vy * dt;

}

// ---------- effects ----------
function updateFx(dt) {

    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt;
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === 'petal') p.x += Math.sin(time * 3 + p.ph) * 14 * dt;
  }
  for (let i = flyers.length - 1; i >= 0; i--) { flyers[i].t += dt / 0.6; if (flyers[i].t >= 1) { flyers.splice(i, 1); hudPulse = 0.2; } }
  for (let i = bubbles.length - 1; i >= 0; i--) { bubbles[i].t += dt; if (bubbles[i].t > bubbles[i].dur) bubbles.splice(i, 1); }
  for (const d of drops) d.t += dt;

    if (vis.length) { const f = vis[Math.random() * vis.length | 0]; emit({ x: f[1] * TS + 8 + Math.random() * 10 - 5, y: f[2] * TS + 4 + Math.random() * 6, vy: -6, life: 0.6, kind: 'spark', c: '#fff6c8' }); }

function updatePlay(dt) {

// ---------- render ----------
const DIG = { 0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001', 5: '111100111001111',

function drawEntities() {

  }
  for (const e of enemies) list.push([e.y, () => drawEnemy(e)]);
  if (room.id === '4,0') list.push([46, () => blit(pfx, ((time % 4.2) < 0.15 ? CAT_BLINK : CAT)[P.x < 264 ? 'l' : 'r'], 264, 46)]);
  if (room.id === '5,0') list.push([GIRL.y, () => {
    const mood = GIRL.mood === 'idle' && (time % 3.7) < 0.13 ? 'blink' : GIRL.mood;
    shadow(GIRL.x, GIRL.y, 10);
    blit(pfx, GIRL_TD[mood], GIRL.x, GIRL.y);
    if (GIRL.holding && bouquetSmall) blit(pfx, bouquetSmall, GIRL.x + 10, GIRL.y + 1);
  }]);
  list.push([P.y, () => drawPlayer(P.x, P.y)]);
  list.sort((a, b) => a[0] - b[0]);
  for (const [, fn] of list) fn();
  if (gift && bouquetSmall) {
    const e = gift.t * gift.t * (3 - 2 * gift.t);
    blit(pfx, bouquetSmall, lerp(P.x, GIRL.x + 10, e), lerp(P.y - 15, GIRL.y + 1, e) - Math.sin(Math.PI * gift.t) * 12);
  }
  if (room.id === '0,0' || room.id === '3,0') for (const b of BUTTERFLIES) pfx.drawImage(BUTTERFLY[b.col][Math.floor(time * 7 + b.ph) % 2], Math.round(b.x), Math.round(b.y));
}
function drawLights(r, ox, oy, night) {
  if (night < 0.05) return;
  const flies = r.id === '5,0' || r.id === '4,0';
  pfx.globalCompositeOperation = 'lighter';
  for (const l of r.lamps) glow(pfx, ox + l.x, oy + l.y, 26, '#ffcf7a', 0.35 * night);
  for (const l of r.lights) glow(pfx, ox + l.x, oy + l.y, l.r, l.c, 0.5 * night);
  for (const t of r.treeLights) glow(pfx, ox + t.x, oy + t.y, 4, t.c, 0.5 * night * (0.55 + 0.45 * Math.sin(time * 2.4 + t.ph)));
  if (flies) for (const f of FLIES) glow(pfx, ox + f.x, oy + f.y, 4, '#d8ff8a', 0.4 * night * (0.5 + 0.5 * Math.sin(time * 3 + f.ph * 3)));
  pfx.globalCompositeOperation = 'source-over';
  pfx.fillStyle = rgba('#ffcf6e', 0.9 * night);
  for (const [wx, wy] of r.windows) pfx.fillRect(ox + wx, oy + wy, 6, 6);
  pfx.fillStyle = rgba('#fff4c8', night);
  for (const l of r.lamps) pfx.fillRect(ox + l.x - 2, oy + l.y - 2, 4, 4);
  for (const l of r.lights) if (l.core) { pfx.fillStyle = rgba(l.c, night); pfx.fillRect(ox + l.core[0], oy + l.core[1], l.core[2], l.core[3]); }
  for (const t of r.treeLights) { pfx.fillStyle = rgba(t.c, night * (0.6 + 0.4 * Math.sin(time * 2.4 + t.ph))); pfx.fillRect(ox + t.x, oy + t.y, 1, 1); }
  if (flies) for (const f of FLIES) { pfx.fillStyle = rgba('#efffb0', night * (0.5 + 0.5 * Math.sin(time * 3 + f.ph * 3))); pfx.fillRect(Math.round(ox + f.x), Math.round(oy + f.y), 1, 1); }
}
function drawParticles() {
  for (const p of parts) {
    const a = Math.min(1, p.life / (p.max * 0.5)), x = Math.round(p.x), y = Math.round(p.y);
    pfx.globalAlpha = a;
    if (p.kind === 'heart') pfx.drawImage(HEART_S, x, y);
    else if (p.kind === 'spark') { pfx.fillStyle = p.c; pfx.fillRect(x, y - 1, 1, 3); pfx.fillRect(x - 1, y, 3, 1); }
    else if (p.kind === 'petal') { pfx.fillStyle = p.c; pfx.fillRect(x, y, Math.sin(time * 4 + p.ph) > 0 ? 2 : 1, 1); }
    else if (p.kind === 'fw') { pfx.globalCompositeOperation = 'lighter'; pfx.fillStyle = p.c; pfx.fillRect(x, y, 1, 1); pfx.globalCompositeOperation = 'source-over'; }
    else { pfx.fillStyle = p.c; pfx.fillRect(x, y, 1, 1); }
  }
  pfx.globalAlpha = 1;
}
function drawEnvelopeScene() {
  if (!CUT.env) return;
  const t = CUT.env.t, k = smooth(0, 0.8, t);
  const flap = clamp((t - 1.1) / 0.5, 0, 1), rise = clamp((t - 1.6) / 0.7, 0, 1);
  pfx.fillStyle = `rgba(20,10,30,${0.5 * k})`; pfx.fillRect(0, 0, RW, RH);
  drawEnvelope(envC, flap, rise);
  const sc = lerp(0.4, 2, k), w = Math.round(54 * sc), h = Math.round(60 * sc);
  const cx = lerp(P.x, RW / 2, k), cy = lerp(P.y - 24, RH / 2 + 2, k);
  pfx.drawImage(envC, Math.round(cx - w / 2), Math.round(cy - h / 2), w, h);
  if (rise > 0 && Math.random() < 0.5) emit({ x: RW / 2 + Math.random() * 90 - 45, y: 40 + Math.random() * 60, vy: -10, life: 0.7, kind: 'spark', c: '#fff6c8' });
}
function drawHUD() {
  ctx.fillStyle = '#2a1630'; ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = '#4a2f58'; ctx.fillRect(0, HUD_H - 2, W, 1);
  ctx.fillStyle = '#120a18'; ctx.fillRect(0, HUD_H - 1, W, 1);
  for (let i = 0; i < 3; i++) {
    const v = P.hp - i * 2;
    ctx.drawImage(v >= 2 ? HUD_HEART.full : v === 1 ? HUD_HEART.half : HUD_HEART.empty, 6 + i * 10, 6);
  }
  for (let i = 0; i < NEED; i++) {
    const x = 46 + i * 9, y = 7;
    if (i < collected.length && !flyers.some(f => f.slot === i)) ctx.drawImage(MINI[collected[i]], x, y - (hudPulse > 0 && i === collected.length - 1 ? 1 : 0));
    else { ctx.fillStyle = '#4a2f58'; ctx.fillRect(x + 1, y + 1, 3, 3); }
  }
  const label = `${count}/${NEED}`;
  pxText(ctx, label, 138, 8, INK); pxText(ctx, label, 137, 7, '#fff7ef');
  const cur = trans ? trans.to.rx : room.rx;
  disc(ctx, 162, 9, 2, '#ffd23f');
  ctx.fillStyle = '#4a2f58'; ctx.fillRect(172, 9, 110, 1);
  ROOM_ORDER.forEach((id, i) => {
    const nx = 172 + i * 22;
    if (i < cur) { ctx.fillStyle = JOURNEY_COLS[i]; ctx.fillRect(nx - 1, 8, 3, 3); ctx.fillRect(nx + 2, 9, 19, 1); }
    else if (i === cur) {
      ctx.fillStyle = '#fff7ef'; ctx.fillRect(nx - 3, 6, 7, 7);
      ctx.fillStyle = JOURNEY_COLS[i]; ctx.fillRect(nx - 2, 7, 5, 5);
    } else { ctx.fillStyle = '#4a2f58'; ctx.fillRect(nx - 1, 8, 3, 3); }
  });
  disc(ctx, 292, 9, 2, '#fff1c9'); ctx.fillStyle = '#2a1630'; ctx.fillRect(293, 7, 2, 3);
  for (const f of flyers) {
    const e = f.t * f.t * (3 - 2 * f.t), tx = 46 + f.slot * 9;
    ctx.drawImage(MINI_OUT[f.type], Math.round(lerp(f.x0, tx, e)), Math.round(lerp(f.y0, 6, e) - Math.sin(Math.PI * f.t) * 18));
  }
}
function render() {
  pfx.clearRect(0, 0, RW, RH);
  let gx = room.rx + clamp(P.x / RW, 0, 1);
  if (state === 'trans') gx = lerp(trans.from.rx + trans.sx / RW, trans.to.rx + trans.ex / RW, smooth(0, 1, trans.t));
  const { warm, night } = todAt(gx);
  if (state === 'trans') {
    const e = smooth(0, 1, trans.t);
    drawRoomLayer(trans.from, -trans.dx * RW * e, -trans.dy * RH * e);
    drawRoomLayer(trans.to, trans.dx * RW * (1 - e), trans.dy * RH * (1 - e));
    P.moving = true; P.walkT += 1;
    drawPlayer(Math.round(lerp(trans.sx, trans.ex, e)), Math.round(lerp(trans.sy, trans.ey, e)));
    tint(pfx, 0.26 * warm, 0.5 * night);
    drawLights(trans.from, Math.round(-trans.dx * RW * e), Math.round(-trans.dy * RH * e), night);
    drawLights(trans.to, Math.round(trans.dx * RW * (1 - e)), Math.round(trans.dy * RH * (1 - e)), night);
  } else {
    drawRoomLayer(room, 0, 0);
    drawEntities();
    tint(pfx, 0.26 * warm, 0.5 * night);
    drawLights(room, 0, 0, night);
  }
  drawParticles();
  for (const b of bubbles) {
    const who = b.who === 'girl' ? GIRL : P, rise = Math.min(1, b.t / 0.12);
    blit(pfx, BUBBLES[b.kind], who.x + 7, who.y - 19 - Math.round(rise * 2));
  }
  drawEnvelopeScene();
  ctx.fillStyle = '#0b0610'; ctx.fillRect(0, 0, W, H);
  const sx = shake > 0 ? Math.round(Math.random() * 2 - 1) : 0, sy = shake > 0 ? Math.round(Math.random() * 2 - 1) : 0;
  ctx.drawImage(pf, sx, HUD_H + sy);
  drawHUD();
  if (state === 'dead') { ctx.fillStyle = `rgba(20,8,24,${Math.min(0.75, deadT * 0.8)})`; ctx.fillRect(0, HUD_H, W, RH); }
  if (state === 'cut' || state === 'card') {
    const bh = Math.round(HUD_H * CUT.bars);
    ctx.fillStyle = '#0b0610'; ctx.fillRect(0, 0, W, bh); ctx.fillRect(0, H - bh, W, bh);
  }
  if (CUT.flash > 0) {
    const a = CUT.flash < 0.5 ? CUT.flash / 0.5 : Math.max(0, 1 - (CUT.flash - 0.5) / 0.9);
    if (a > 0) { ctx.fillStyle = `rgba(255,243,246,${a})`; ctx.fillRect(0, 0, W, H); }
  }
}

// ---------- UI ----------
const wrap = $('wrap'), stage = $('stage'), banner = $('banner'), hint = $('hint');
const titleScreen = $('titleScreen'), startBtn = $('startBtn'), endScreen = $('endScreen');
const card = $('card'), replayBtn = $('replayBtn');
const typedEl = $('typed'), restEl = $('rest'), letterEl = $('letter'), signEl = $('sign');
const isTouch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

if (CONFIG.forName) $('titleSub').textContent = 'Chuyến phiêu lưu nhỏ dành tặng ' + CONFIG.forName;
$('cardTitle').textContent = CONFIG.cardTitle;
signEl.textContent = CONFIG.signature ? '— ' + CONFIG.signature : '';
if (isTouch) { $('controls').hidden = false; $('keysHint').textContent = 'Kéo cần bên trái để đi · nút ⚔ để chém'; }
[['cTL', 'rose'], ['cTR', 'daisy'], ['cBL', 'tulip'], ['cBR', 'lotus']].forEach(([id, k]) => { $(id).src = HEADS[k].toDataURL(); });

(function titleArt() {
  const c = $('titleArt'), x = c.getContext('2d');
  x.fillStyle = '#5cb947'; x.fillRect(0, 34, 76, 6); x.fillStyle = '#86d96a'; x.fillRect(0, 34, 76, 1);
  blit(x, FL.daisy, 6, 37); blit(x, FL.tulip, 70, 37); blit(x, FL.rose, 38, 37);
  blit(x, BOY.down.s, 22, 37);
  const s = SWORD.UR; x.drawImage(s.img, 22 + 6 - s.ax, 37 - 7 - s.ay);
  blit(x, GIRL_TD.idle, 54, 37);
  blit(x, SLIME.pink[0], 64, 39);
  x.drawImage(HEART_L, 34, 4);
})();

function layout() {
  const portrait = innerHeight > innerWidth;
  document.documentElement.style.setProperty('--ctrl-h', (isTouch && portrait ? 200 : 0) + 'px');
  const cs = getComputedStyle(wrap);
  const aw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let s = Math.max(0.5, Math.min(aw / W, ah / H));
  const dpr = window.devicePixelRatio || 1, crisp = Math.floor(s * dpr) / dpr;
  if (crisp >= s * 0.97) s = crisp;
  stage.style.width = W * s + 'px'; stage.style.height = H * s + 'px';
  stage.style.setProperty('--u', s + 'px');
  $('rotateHint').hidden = !(isTouch && portrait);
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 200));
layout();

let bannerTimer = 0;
function showBanner(r) {
  $('bannerTitle').textContent = r.name; $('bannerSub').textContent = r.sub;
  banner.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => banner.classList.remove('show'), 2400);
}
function showHint() {
  hint.textContent = isTouch ? 'Kéo cần để đi · nút ⚔ để chém' : 'Mũi tên để đi · J / Space để chém';
  hint.classList.add('show');
  setTimeout(() => hint.classList.remove('show'), 6000);
}
startBtn.addEventListener('click', () => {
  Snd.init();
  titleScreen.hidden = true; startBtn.blur();
  state = 'play';
  showBanner(room); showHint();
});

let typing = null, letterChars = [];
function showCard() {
  state = 'card'; CUT.env = null;
  const bq = makeBouquet(collected, true), big = $('bqBig');
  big.width = bq.width; big.height = bq.height; big.getContext('2d').drawImage(bq, 0, 0);
  endScreen.hidden = false; card.hidden = false;
  setTimeout(() => { endScreen.classList.add('show'); card.classList.add('show'); }, 40);
  setTimeout(startTyping, 800);
}
function startTyping() {
  letterChars = Array.from(CONFIG.letter.normalize('NFC'));
  let i = 0;
  typedEl.textContent = ''; restEl.textContent = letterChars.join('');
  letterEl.classList.add('typing');
  typing = setInterval(() => {
    i++;
    typedEl.textContent = letterChars.slice(0, i).join(''); restEl.textContent = letterChars.slice(i).join('');
    if (letterChars[i - 1] !== ' ' && i % 2) Snd.blip();
    if (i >= letterChars.length) finishTyping();
  }, 62);
}
function finishTyping() {
  if (!typing) return;
  clearInterval(typing); typing = null;
  typedEl.textContent = letterChars.join(''); restEl.textContent = '';
  letterEl.classList.remove('typing');
  signEl.classList.add('show');
  setTimeout(() => { replayBtn.hidden = false; }, 900);
  Snd.chime();
}
card.addEventListener('click', e => { if (typing && e.target !== replayBtn) finishTyping(); });

replayBtn.addEventListener('click', () => {
  endScreen.classList.remove('show'); endScreen.hidden = true;
  card.classList.remove('show'); card.hidden = true; replayBtn.hidden = true;
  signEl.classList.remove('show'); typedEl.textContent = ''; restEl.textContent = '';
  for (const id in ROOMS) { const r = ROOMS[id]; r.grid = r.map.map(row => row.split('')); buildRoom(r); }
  killed.clear(); taken.clear(); collected.length = 0; count = 0; gateOpen = false; catHeart = false;
  Object.assign(P, { x: START.x, y: START.y, face: 'down', hp: 6, inv: 0, kbT: 0, atkT: 0, pose: null });
  spawn.x = START.x; spawn.y = START.y;
  Object.assign(GIRL, { mood: 'idle', holding: false });
  Object.assign(CUT, { t: 0, a: 0, arrived: false, done: {}, bars: 0, env: null, flash: 0 });
  fireworksOn = false; rockets.length = 0; parts.length = 0; bubbles.length = 0; flyers.length = 0; gift = null; bouquetSmall = null;
  enterRoom(ROOMS[START.room]); state = 'play';
  Snd.setMode('play'); showBanner(room);
  replayBtn.blur();
});

const muteBtn = $('muteBtn');
muteBtn.addEventListener('click', () => {
  const m = muteBtn.getAttribute('aria-pressed') !== 'true';
  muteBtn.setAttribute('aria-pressed', String(m));
  muteBtn.setAttribute('aria-label', m ? 'Bật nhạc' : 'Tắt nhạc');
  Snd.setMuted(m); muteBtn.blur();
});
document.addEventListener('visibilitychange', () => Snd.pause(document.hidden));

// ---------- input ----------
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
const ATTACK_KEYS = new Set([' ', 'j', 'J', 'x', 'X', 'k', 'K']);
addEventListener('keydown', e => {
  if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;
  const k = KEYMAP[e.key];
  if (k) { keys[k] = true; if (state === 'play' || state === 'cut') e.preventDefault(); }
  else if (ATTACK_KEYS.has(e.key)) { if (state === 'play') { e.preventDefault(); if (!e.repeat) attackPressed = true; } }
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
addEventListener('blur', () => { keys.up = keys.down = keys.left = keys.right = false; });

const stick = $('stick'), knob = $('knob');
let stickId = null;
function stickMove(e) {
  const r = stick.getBoundingClientRect(), max = r.width * 0.32;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy);
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const nx = dx / max, ny = dy / max;
  if (Math.hypot(nx, ny) < 0.25 || state !== 'play') { stickV.x = 0; stickV.y = 0; } else { stickV.x = nx; stickV.y = ny; }
}
stick.addEventListener('pointerdown', e => { e.preventDefault(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
const stickEnd = e => { if (e.pointerId !== stickId) return; stickId = null; stickV.x = stickV.y = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
const atkBtn = $('atkBtn');
atkBtn.addEventListener('pointerdown', e => { e.preventDefault(); atkBtn.classList.add('on'); if (state === 'play') attackPressed = true; });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => atkBtn.addEventListener(t, () => atkBtn.classList.remove('on')));
[stick, atkBtn].forEach(el => el.addEventListener('contextmenu', e => e.preventDefault()));

// ---------- loop ----------
enterRoom(room);
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now; acc += dt;
  while (acc >= STEP) { fixedUpdate(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
startBtn.focus({ preventScroll: true });
</script>
</body>
